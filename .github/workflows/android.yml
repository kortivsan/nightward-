name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les outils
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Générer l'icône et l'écran de lancement
        run: npx capacitor-assets generate --android

      - name: Copier le site dans l'application
        run: npx cap sync android

      - name: Verrouiller l'application en portrait
        run: sed -i 's/android:configChanges=/android:screenOrientation="portrait" android:configChanges=/' android/app/src/main/AndroidManifest.xml

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: nightward-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
